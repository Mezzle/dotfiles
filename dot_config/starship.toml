# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """ $aws$username$hostname$jobs$character"""
right_format="""
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$package\
$golang\
$helm\
$nodejs\
$php\
$python\
$ruby\
$rust\
$terraform\
$memory_usage\
$env_var\
$custom\
$cmd_duration\
$line_break\
$time\
$status\
$container\
"""

add_newline = false


# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "catppuccin_macchiato"

# Starship modules
[character]
# Note the use of Catppuccin color 'peach'
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰄛](red) ❯](peach)"
vimcmd_symbol = "[󰄛 ❮](subtext1)" # For use with zsh-vi-mode

[git_branch]
style = "bold mauve"
format = '[$symbol$branch(:$remote_branch)]($style) '

[directory]
truncation_length = 4
style = "bold lavender"
truncation_symbol = '…/'

# Palette definitions
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[aws]
disabled = false
format = '[$symbol($profile )(\($region\) )]($style)'

[aws.region_aliases]
eu-west-2 = 'lon'

